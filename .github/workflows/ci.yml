name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The packaging files are only exercised when a release is built, which is
  # the worst moment to discover a typo in one: the tag is already pushed. They
  # cost seconds to parse, so they are parsed on every push instead (Muster's
  # first MSI build broke on an XML comment with two hyphens in a row).
  packaging:
    name: packaging files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse
        run: |
          python3 - <<'PY'
          import sys, xml.dom.minidom, yaml
          bad = False
          for f in ['packaging/windows/heft.wxs',
                    'packaging/io.github.spillebulle.heft.metainfo.xml']:
              try:
                  xml.dom.minidom.parse(f)
              except Exception as e:
                  bad = True
                  print(f'{f}: {e}')
          for f in ['.github/workflows/ci.yml',
                    '.github/workflows/release.yml']:
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad = True
                  print(f'{f}: {e}')
          sys.exit(1 if bad else 0)
          PY

      - name: Shell syntax
        run: |
          for f in packaging/linux/*.sh packaging/linux/heft.install                    packaging/windows/*.sh packaging/check.sh tools/*.sh; do
            bash -n "$f"
          done

      - name: Desktop entry
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/io.github.spillebulle.heft.desktop

      # The application id has to be the same name in the AppStream file, the
      # desktop entry, the icons, the window and the packaging scripts, and the
      # archive paths the same in the scriptlets and the updater. See the
      # header of the script.
      - name: Metadata consistency
        run: sh packaging/check.sh

  # Every runner the release will build on (CLAUDE.md: adding a target to the
  # release matrix means adding its runner here in the same commit). No macOS:
  # it is not a target. ubuntu-22.04 rather than latest, for the older glibc.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - windows-latest
          - windows-11-arm

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libxrandr-dev libxi-dev \
            libgtk-3-dev mesa-vulkan-drivers

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        # The walker's Linux-only tests (hard links counted once, unreadable
        # folders reported, symlinks not followed) only run here.
        run: cargo test --workspace

      - name: Bench the walker on the runner's own system
        if: runner.os == 'Linux'
        run: cargo run --release -- bench /usr
