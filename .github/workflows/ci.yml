name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Every runner the release will build on (CLAUDE.md: adding a target to the
  # release matrix means adding its runner here in the same commit). No macOS:
  # it is not a target. ubuntu-22.04 rather than latest, for the older glibc.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - windows-latest
          - windows-11-arm

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libxrandr-dev libxi-dev \
            libgtk-3-dev mesa-vulkan-drivers

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        # The walker's Linux-only tests (hard links counted once, unreadable
        # folders reported, symlinks not followed) only run here.
        run: cargo test --workspace

      - name: Bench the walker on the runner's own system
        if: runner.os == 'Linux'
        run: cargo run --release -- bench /usr
